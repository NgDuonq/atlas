[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-workspace"
version = "0.1.0.dev1"
description = "Local project workspace with inspectable AI context and source provenance"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]
